{% import "_icons.html" as ico %}

<button type="button" class="verdict"
        data-band="{{ verdict.band }}"
        data-tag="{{ verdict.tag }}"
        data-phrase="{{ verdict.evidence.top_phrase }}"
        aria-pressed="false">

  <div class="verdict-top">
    <span class="chip chip-{{ verdict.band }}">
      {{ ico.icon(BANDS[verdict.band].icon, 12) }} {{ BANDS[verdict.band].word }}
    </span>
    <span class="verdict-slug mono">{{ verdict.tag }}</span>
    {% if not verdict.calibrated %}
      <span class="chip chip-warn">uncalibrated</span>
    {% endif %}
    <span class="verdict-score tnum">{{ "%.3f" | format(verdict.score) }}</span>
  </div>

  {# NOTHING GOES HERE. No ruler, because no threshold was consulted: `score` is the model's
     OWN reported certainty, not a similarity to be placed on an absent/uncertain/present
     scale, and drawing that ruler would claim a measurement that never happened -- the one
     thing this interface must never do. AGENTS.md rule 3.

     A box reading "Read, not ranked." also used to sit here, explaining that absence. It was
     written as the `{% if read %}` branch of three, back when the ruler was what a card
     normally showed and this was the rare exception worth explaining. The ruler went with the
     ranking model; the box lost its guard and started printing on every card -- an
     explanation of a departure from a norm no reader has ever seen, restating a verdict the
     chip above already gives and a score already printed at 3dp. #}
  {% if verdict.band != 'absent' %}
    <p class="verdict-phrase">{{ BANDS[verdict.band].note }}</p>
  {% endif %}

  <p class="verdict-phrase">
    Saw <em>&ldquo;{{ verdict.evidence.top_phrase }}&rdquo;</em>
  </p>

  <div class="verdict-meta">
    <span>{{ verdict.confidence }} confidence</span>
    <span class="mono">{{ verdict.decided_by }}</span>
    {% if not verdict.calibrated %}
      <span>not measured against the eval set</span>
    {% endif %}
    {# For video, WHEN is as actionable as whether — it is what a reviewer scrubs to. #}
    {% if verdict.evidence.frame %}
      <span class="tnum">at {{ "%.1f" | format(verdict.evidence.frame.timestamp_s) }}s</span>
    {% endif %}
  </div>
</button>
