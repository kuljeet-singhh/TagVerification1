[project]
name = "dooh-tag-verification"
version = "1.0.0"
description = "Verify that a DOOH creative actually contains the content it is tagged with"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    # Added when the first real schema change landed (api_keys.scopes, migrations/versions/
    # 0001). Before that, docs/schema.sql provisioned a new database and the inherited one
    # needed nothing. schema.sql is still the provisioning file; Alembic is how an EXISTING
    # database moves forward, and a column belongs in both.
    "alembic>=1.13",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "pillow>=10.0",
    # Video decoding, for sampling frames out of a video creative. A codec binding, not ML;
    # its wheels bundle ffmpeg statically, so there is no system package and no Dockerfile
    # change. ~18MB.
    "av>=13",
    # The two scorer providers. Both are dependencies rather than extras on purpose: `dooh
    # gate` scores the same images with each and picks on the numbers, which cannot happen if
    # installing the loser is a separate step. HTTP clients with pydantic models, ~1MB each,
    # and httpx was already here.
    "anthropic>=0.40",
    "google-genai>=2.0",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
]

[project.scripts]
dooh = "tagverify.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `inference` is still a package so its measurements ship with the wheel, but it holds no code
# any more — the model, its client and the pack it published were removed on 2026-09-01.
#
# Discovered, not hand-listed. Because `tagverify` sits at the repo root it is importable from
# the working tree whether or not it is declared correctly, so a hand-maintained list can omit
# a subpackage and ship a broken wheel with a fully green test suite.
#
# namespaces = false is load-bearing, not cosmetic: the default is true, and inference/eval/
# would otherwise be picked up as a PEP-420 namespace package.
include = ["tagverify*", "inference*"]
namespaces = false

[tool.setuptools.package-data]
tagverify = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The labelled eval images are data, not code. Named explicitly so they stay out of scope even
# when ruff is run with --no-respect-gitignore.
extend-exclude = ["inference/eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are the documented idiom

[tool.ruff.lint.isort]
known-first-party = ["tagverify", "inference"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
