[project]
name = "dooh-tag-verification"
version = "1.0.0"
description = "Verify that a DOOH creative actually contains the content it is tagged with"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    # No migration tool yet, deliberately: the schema is stable and inherited unchanged from
    # the previous implementation, so docs/schema.sql provisions a new database and the
    # existing one needs nothing. Add Alembic when the first real schema change lands.
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "gradio-client>=1.5",
    "httpx>=0.28",
    "pillow>=10.0",
    # Video decoding, for sampling frames out of a video creative. This is NOT a breach of
    # the "never add torch/transformers/gradio here" rule: av is a codec binding, not ML, and
    # the web-tier / model-tier split is untouched — the Space still only ever sees a still.
    # Its wheels bundle ffmpeg statically, so there is no system package and no Dockerfile
    # change. ~18MB, against ~2GB for the ML stack it is often confused with.
    "av>=13",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
]

[project.scripts]
dooh = "tagverify.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `inference` is a package here so the web app can import the shared banding rule
# from inference/banding.py. That directory is ALSO git-subtree-pushed to the
# Hugging Face Space, where it runs flat (no package); see inference/banding.py.
#
# Discovered, not hand-listed. Because `tagverify` sits at the repo root it is importable from the
# working tree whether or not it is declared correctly, so a hand-maintained list can omit a
# subpackage and ship a broken wheel with a fully green test suite.
#
# namespaces = false is load-bearing, not cosmetic: the default is true, and inference/eval/
# and inference/.testimages/ would otherwise be picked up as PEP-420 namespace packages.
include = ["tagverify*", "inference*"]
namespaces = false

[tool.setuptools.package-data]
tagverify = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff honours .gitignore already, which covers all three. Naming them explicitly keeps the
# model tier's virtualenv and its regenerable image sets out of scope even when ruff is run
# with --no-respect-gitignore.
extend-exclude = ["inference/.venv", "inference/eval", "inference/.testimages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are the documented idiom

[tool.ruff.lint.isort]
# Inside the Hugging Face Space, inference/ runs FLAT: app.py does `from detector import
# Detector`, not `from .detector import`. Without this, ruff reads those as third-party and
# merges them into the PIL/torch block, erasing the visual separation between "someone else's
# code" and "this directory's own modules, imported the way the Space sees them". The shim
# that makes both forms work is documented in inference/detector.py:56-65.
known-first-party = ["banding", "detector", "versioning", "tagverify", "inference"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
