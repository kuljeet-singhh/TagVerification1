# Keeps the Hugging Face Space warm.
#
# Free Spaces sleep after 48 hours of inactivity, and waking one re-downloads
# ~400MB of SigLIP 2 weights (~30-60s) — far past Vercel's 10s function limit.
# Every 6 hours leaves a wide safety margin against a few missed runs.
#
# Requires, on this repo:
#   secret  HF_TOKEN        an HF token with read access
#   var     HF_SPACE_HOST   e.g. kuljeet-singhh-dooh-tag-check.hf.space
#
# If this silently stops, the first request after 48h eats the cold start:
# /api/v1/analyze returns 503 INFERENCE_WARMING with retry_after rather than
# hanging, so it degrades honestly — but it does degrade.
name: keepalive

on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Space's /health endpoint
        run: |
          curl -sS -m 120 -X POST \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"data":[]}' \
            "https://${{ vars.HF_SPACE_HOST }}/gradio_api/call/health"
